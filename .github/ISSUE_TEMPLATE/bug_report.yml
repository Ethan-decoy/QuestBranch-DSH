name: 问题反馈
description: 报告可复现的安装、研究或界面问题。
body:
  - type: input
    id: versions
    attributes:
      label: QB 与 DSH 版本
      placeholder: QB 0.1.0-dev.1 / DSH 0.2.1-rc.5
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统与承载
      placeholder: Windows 11 / DSH Web
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤、预期与实际结果
      description: 请使用最小示例说明问题。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏截图或日志
      description: 移除研究正文、账号、令牌和本机敏感路径；安全漏洞请先阅读 SECURITY.md。
